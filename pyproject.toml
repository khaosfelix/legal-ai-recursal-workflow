[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-ai-recursal-workflow"
version = "3.0.0"
description = "Workflow sintético de análise recursal e operação jurídica em alto volume."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
legal-ai-demo = "legal_ai_recursal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
