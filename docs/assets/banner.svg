<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Legal AI Recursal Workflow</title>
  <desc id="desc">Automação jurídica híbrida com LLM, regras determinísticas e validação humana</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09060d"/>
      <stop offset="52%" stop-color="#171020"/>
      <stop offset="100%" stop-color="#2d0d42"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="180" fill="#6d28d9" opacity=".13"/>
  <circle cx="1010" cy="310" r="220" fill="#c026d3" opacity=".08"/>
  <rect x="70" y="74" width="8" height="212" rx="4" fill="url(#accent)" filter="url(#glow)"/>
  <text x="110" y="142" fill="#f7f4fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="700">
    Legal AI Recursal Workflow
  </text>
  <text x="112" y="198" fill="#c9bfd5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">
    LLM + regras determinísticas + validação humana
  </text>
  <text x="112" y="246" fill="#9e91ad" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">
    Automação jurídica auditável • dados sintéticos • arquitetura orientada a testes
  </text>
  <g transform="translate(860,132)">
    <rect width="250" height="112" rx="18" fill="#ffffff" opacity=".045" stroke="#a78bfa" stroke-opacity=".35"/>
    <text x="28" y="46" fill="#d8b4fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">AI → STRUCTURE</text>
    <text x="28" y="78" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">RULES → CONTROL</text>
  </g>
</svg>
